<!doctype html>
<meta charset="utf-8">
<title>Проверка хранилища</title>
<body style="font:16px/1.5 -apple-system,system-ui,sans-serif;padding:40px">
<h1 id="out">Проверяю…</h1>
<p id="detail" style="color:#666"></p>
<script>
  var out = document.getElementById('out');
  var detail = document.getElementById('detail');
  try {
    localStorage.setItem('probe', 'ok');
    var back = localStorage.getItem('probe');
    localStorage.removeItem('probe');
    if (back === 'ok') {
      out.textContent = 'РАБОТАЕТ';
      out.style.color = 'green';
    } else {
      out.textContent = 'НЕ РАБОТАЕТ: записалось, но не прочиталось';
      out.style.color = 'crimson';
    }
  } catch (e) {
    out.textContent = 'НЕ РАБОТАЕТ: ' + e.name;
    out.style.color = 'crimson';
  }
  detail.textContent = 'протокол: ' + location.protocol + ' · браузер: ' + navigator.userAgent;
</script>
