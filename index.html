<!doctype html>
<html lang="ru" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ориентир</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg style="display:none">
  <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h3l2-4 3 8 2.5-5 1.5 3h6"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="7.5" ry="3.2"/><path d="M4.5 7v10c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2V7"/><path d="M4.5 12c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2"/></symbol>
  <symbol id="i-skill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v14H6.5A2.5 2.5 0 0 0 4 19.5z"/><path d="M9 7.5h6M9 11h4"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3.2 3.2 0 0 1 0 6.3M17.5 14.6a5.5 5.5 0 0 1 3 4.9"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/></symbol>
</svg>

<button class="tt" id="tt" aria-label="Сменить тему"><svg><use href="#i-sun"/></svg></button>

<div class="notice-wrap" id="noticeWrap" hidden><div class="notice" id="notice"></div></div>

<section class="dreams"><div class="wrap">
  <p class="eyebrow">Карта желаний</p>
  <h1 class="serif">То, ради чего<br>всё остальное</h1>
  <p class="lead">Здесь только то, что не имеет срока. Планы ниже — способ подойти ближе.</p>
  <div class="dreams__grid" id="dreams"></div>
  <button class="add" id="addDream" style="max-width:260px;margin-top:26px">+ Добавить мечту</button>
</div></section>

<main id="horizons"></main>

<div class="wrap foot">
  <button class="btn" id="exportBtn">Сохранить копию</button>
  <button class="btn btn--g" id="importBtn">Загрузить</button>
  <input type="file" id="importInput" accept="application/json,.json" hidden>
</div>

<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
